name: Diagnose Python image with source client

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MVM_SOURCE_SHA: e9b9d8c5876edb11c410728f8030f3678656adf9
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: tinylabscom/mvm
          ref: e9b9d8c5876edb11c410728f8030f3678656adf9
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: packs
          persist-credentials: false
      - name: Require KVM for the project builder VM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo -n setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install verified Firecracker
        env:
          FC_VERSION: v1.17.0
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/firecracker-${FC_VERSION}-x86_64.tgz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" \
            "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VERSION}/firecracker-${FC_VERSION}-x86_64.tgz"
          printf '%s  %s\n' '06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sudo -n install -m 0755 "$RUNNER_TEMP/release-${FC_VERSION}-x86_64/firecracker-${FC_VERSION}-x86_64" \
            /usr/bin/firecracker
          sudo -n sh -c 'command -v firecracker && firecracker --version'
      - uses: ./.github/actions/install-zigbuild
      - name: Build pinned static source client
        env:
          OPENSSL_STATIC: "1"
          OPENSSL_VENDORED: "1"
          MVM_EMBED: "0"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MVM_SOURCE_SHA"
          firecracker --version
          cargo zigbuild --profile release-min --target x86_64-unknown-linux-musl --features dev
          cargo zigbuild --profile release-min --target x86_64-unknown-linux-musl -p mvm-hostd --bin mvm-network-endpoint
          binary=target/x86_64-unknown-linux-musl/release-min/mvmctl
          endpoint=target/x86_64-unknown-linux-musl/release-min/mvm-network-endpoint
          test -x "$binary"
          test -x "$endpoint"
          "$binary" --version
          sha256sum "$binary"
          sha256sum "$endpoint"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install verified cosign v3
        env:
          COSIGN_V3_VERSION: v3.1.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64 "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64.sigstore.json "${base}/cosign-linux-amd64.sigstore.json"
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
      - name: Verify current lock and fetch selected signed base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha=$(gh api repos/tinylabscom/mvm/commits/main --jq .sha)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/tinylabscom/mvm/contents/crates/mvm-core/images.lock?ref=$current_sha" \
            > "$RUNNER_TEMP/current-images.lock"
          cmp crates/mvm-core/images.lock "$RUNNER_TEMP/current-images.lock"
          set_tag=$(python3 -c 'import pathlib,tomllib; p=pathlib.Path("packs/pack-sources/runtime/python/pack.toml"); print(tomllib.loads(p.read_text())["image_build"]["base_set"]["release_tag"])')
          [[ "$set_tag" =~ ^image-set/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_dir="$RUNNER_TEMP/image-set-release"
          mkdir -p "$release_dir"
          gh release download "$set_tag" --repo tinylabscom/mvm-images --dir "$release_dir" \
            -p image-set.json -p image-set.json.bundle \
            -p default-microvm-vmlinux-x86_64 \
            -p default-microvm-rootfs-x86_64.ext4 \
            -p default-microvm-rootfs-x86_64.verity \
            -p default-microvm-rootfs-x86_64.roothash
          cosign verify-blob "$release_dir/image-set.json" \
            --bundle "$release_dir/image-set.json.bundle" \
            --certificate-identity "https://github.com/tinylabscom/mvm-images/.github/workflows/release.yml@refs/tags/${set_tag}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Reproduce unsigned image inside the builder VM
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/python-image-work"
          output="$RUNNER_TEMP/python-image-output"
          release_dir="$RUNNER_TEMP/image-set-release"
          mkdir -p "$work_dir/pack-sources/runtime" "$work_dir/base" "$output"
          cp -R packs/scripts "$work_dir/scripts"
          cp -R packs/pack-sources/runtime/python "$work_dir/pack-sources/runtime/python"
          binary=target/x86_64-unknown-linux-musl/release-min/mvmctl
          endpoint=target/x86_64-unknown-linux-musl/release-min/mvm-network-endpoint
          test -x "$endpoint"
          install -m 0755 "$binary" "$work_dir/mvmctl"
          sha256sum "$work_dir/mvmctl" | cut -d ' ' -f 1 > "$work_dir/mvmctl.sha256"
          cp crates/mvm-core/images.lock "$work_dir/images.lock"
          cp "$release_dir/image-set.json" "$work_dir/image-set.json"
          cp "$release_dir/image-set.json.bundle" "$work_dir/image-set.json.bundle"
          for name in default-microvm-vmlinux-x86_64 \
            default-microvm-rootfs-x86_64.ext4 \
            default-microvm-rootfs-x86_64.verity \
            default-microvm-rootfs-x86_64.roothash; do
            cp "$release_dir/$name" "$work_dir/base/$name"
          done
          MVM_HOME="$RUNNER_TEMP/mvm-home" MVM_SUBSTITUTION_ENDPOINT_PATH="$GITHUB_WORKSPACE/$endpoint" "$binary" \
            --builder firecracker __builder-shell-job \
            --script "$GITHUB_WORKSPACE/packs/scripts/run-python-image-builder.sh" \
            --work-dir "$work_dir" --artifact-out "$output"
          test -s "$output/python-image/candidate.json"
          test -s "$output/python-image/composition/rootfs.ext4"
          test -s "$output/python-image/composition/composition.json"
          sha256sum "$output/python-image/composition/rootfs.ext4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-source-python-image-${{ github.run_id }}
          path: ${{ runner.temp }}/python-image-output/python-image/
          if-no-files-found: error
          retention-days: 3
