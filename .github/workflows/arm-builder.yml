name: Validate arm64 pack builder

on:
  pull_request:
    paths:
      - "pack-sources/runtime/python/image/**"
      - "scripts/build-python-layer.sh"
      - "scripts/stage-python-closure.py"
      - "tests/test_stage_python_closure.py"
      - ".github/workflows/arm-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-python:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require usable KVM for the project builder VM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install verified cosign v3 for arm64
        env:
          COSIGN_V3_VERSION: "v3.1.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-arm64 "${base}/cosign-linux-arm64"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-arm64.sigstore.json "${base}/cosign-linux-arm64.sigstore.json"
          cosign verify-blob cosign-linux-arm64 \
            --bundle cosign-linux-arm64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-arm64 "$HOME/.cosign/cosign"
          hash -r
          cosign version

      - name: Verify the released builder client
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_CLIENT_TAG: "v0.22.0"
          BUILDER_CLIENT_SHA256: "dafb1d9ebb9480b26841c772bee6322015b727b8cc2bc67d82056631101122f9"
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mvm-release"
          mkdir -p "$release_dir"
          archive=mvmctl-aarch64-unknown-linux-gnu.tar.gz
          gh release download "$BUILDER_CLIENT_TAG" --repo tinylabscom/mvm --dir "$release_dir" \
            -p "$archive" -p "${archive}.bundle" \
            -p checksums-sha256.txt -p checksums-sha256.txt.bundle
          identity="https://github.com/tinylabscom/mvm/.github/workflows/release.yml@refs/tags/${BUILDER_CLIENT_TAG}"
          for blob in "$archive" checksums-sha256.txt; do
            cosign verify-blob "$release_dir/$blob" \
              --bundle "$release_dir/${blob}.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          expected=$(awk -v name="$archive" '$2 == name || $2 == "*" name {print $1}' \
            "$release_dir/checksums-sha256.txt")
          test "${#expected}" -eq 64
          actual=$(sha256sum "$release_dir/$archive" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          test "$actual" = "$BUILDER_CLIENT_SHA256"
          tar -C "$RUNNER_TEMP" -xzf "$release_dir/$archive"
          "$RUNNER_TEMP/mvmctl-aarch64-unknown-linux-gnu/mvmctl" --version | \
            grep -F "mvmctl ${BUILDER_CLIENT_TAG#v}"

      - name: Stage pinned Python closure inside the builder VM
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/mvm-python-stage"
          mkdir -p "$output"
          MVM_HOME="$RUNNER_TEMP/mvm-home" \
            "$RUNNER_TEMP/mvmctl-aarch64-unknown-linux-gnu/mvmctl" \
            --builder firecracker __builder-shell-job \
            --script "$GITHUB_WORKSPACE/scripts/build-python-layer.sh" \
            --work-dir "$GITHUB_WORKSPACE" \
            --artifact-out "$output"
          test -s "$output/python-tree.tar"
          tar -tf "$output/python-tree.tar" | grep -Fx 'root/bin/python3'
          tar -tf "$output/python-tree.tar" | \
            grep -Eq '^root/nix/store/[a-z0-9]+-python3-3[.]12[.]13/bin/python3$'
          sha256sum "$output/python-tree.tar"
