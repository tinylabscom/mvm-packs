name: Validate pack sources

on:
  # No path filter: the main ruleset requires this check, so it must report on every PR.
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require a maintainer for first-party namespaces
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        shell: bash  # runs with pipefail, so a failed gh call fails the step instead of passing an empty list
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' | python3 scripts/check-reserved-namespaces.py "$ASSOCIATION" "$SAME_REPO" "$CHANGED_FILES"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Install ext4 inspection tools
        run: sudo apt-get update && sudo apt-get install --yes e2fsprogs
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install cosign v3
        env:
          COSIGN_V3_VERSION: "v3.1.1"
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64.sigstore.json"
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
      - run: python3 -m unittest discover -s tests
      - name: Check pack sources without signing
        run: python3 scripts/build-packs.py --check-sources
      - name: Check generated pack pages are current
        run: python3 scripts/build-pack-pages.py --check
      - name: Build registry site
        run: |
          node scripts/stage-starlight-pages.mjs
          npm run build
      - name: Verify signed registry and public image releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate-packs.py --verify-signatures --require-revocations
