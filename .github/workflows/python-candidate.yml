name: Build unsigned Python image candidate

on:
  workflow_dispatch:
    inputs:
      mvmctl_tag:
        description: Signed compatible mvmctl release tag
        required: true
        type: string
      mvmctl_archive_sha256:
        description: SHA-256 of the signed Linux x86_64 release archive
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      MVMCTL_TAG: ${{ inputs.mvmctl_tag }}
      MVMCTL_ARCHIVE_SHA256: ${{ inputs.mvmctl_archive_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require KVM for the project builder VM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo -n setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install verified cosign v3
        env:
          COSIGN_V3_VERSION: v3.1.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64 "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64.sigstore.json "${base}/cosign-linux-amd64.sigstore.json"
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify the signed released builder client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$MVMCTL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$MVMCTL_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          release_dir="$RUNNER_TEMP/mvmctl-release"
          mkdir -p "$release_dir"
          archive=mvmctl-x86_64-unknown-linux-gnu.tar.gz
          gh release download "$MVMCTL_TAG" --repo tinylabscom/mvm --dir "$release_dir" \
            -p "$archive" -p "${archive}.bundle" \
            -p checksums-sha256.txt -p checksums-sha256.txt.bundle
          identity="https://github.com/tinylabscom/mvm/.github/workflows/release.yml@refs/tags/${MVMCTL_TAG}"
          for blob in "$archive" checksums-sha256.txt; do
            cosign verify-blob "$release_dir/$blob" \
              --bundle "$release_dir/${blob}.bundle" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          expected=$(awk -v name="$archive" '$2 == name || $2 == "*" name {print $1}' \
            "$release_dir/checksums-sha256.txt")
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          actual=$(sha256sum "$release_dir/$archive" | cut -d ' ' -f 1)
          test "$actual" = "$expected"
          test "$actual" = "$MVMCTL_ARCHIVE_SHA256"
          tar -C "$RUNNER_TEMP" -xzf "$release_dir/$archive"
          binary="$RUNNER_TEMP/mvmctl-x86_64-unknown-linux-gnu/mvmctl"
          test -x "$binary"
          "$binary" --version | grep -Fx "mvmctl ${MVMCTL_TAG#v}"
      - name: Fetch the current MVM base lock and selected signed base assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mvm_sha=$(gh api repos/tinylabscom/mvm/commits/main --jq .sha)
          [[ "$mvm_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/tinylabscom/mvm/contents/crates/mvm-core/images.lock?ref=$mvm_sha" \
            > "$RUNNER_TEMP/images.lock"
          set_tag=$(python3 -c 'import pathlib,tomllib; p=pathlib.Path("pack-sources/runtime/python/pack.toml"); print(tomllib.loads(p.read_text())["image_build"]["base_set"]["release_tag"])')
          [[ "$set_tag" =~ ^image-set/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_dir="$RUNNER_TEMP/image-set-release"
          mkdir -p "$release_dir"
          gh release download "$set_tag" --repo tinylabscom/mvm-images --dir "$release_dir" \
            -p image-set.json -p image-set.json.bundle \
            -p default-microvm-vmlinux-x86_64 \
            -p default-microvm-rootfs-x86_64.ext4 \
            -p default-microvm-rootfs-x86_64.verity \
            -p default-microvm-rootfs-x86_64.roothash
      - name: Reproduce the unsigned image inside the builder VM
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/python-image-work"
          output="$RUNNER_TEMP/python-image-output"
          release_dir="$RUNNER_TEMP/image-set-release"
          mkdir -p "$work_dir/pack-sources/runtime" "$work_dir/base" "$output"
          cp -R scripts "$work_dir/scripts"
          cp -R pack-sources/runtime/python "$work_dir/pack-sources/runtime/python"
          binary="$RUNNER_TEMP/mvmctl-x86_64-unknown-linux-gnu/mvmctl"
          install -m 0755 "$binary" "$work_dir/mvmctl"
          sha256sum "$work_dir/mvmctl" | cut -d ' ' -f 1 > "$work_dir/mvmctl.sha256"
          cp "$RUNNER_TEMP/images.lock" "$work_dir/images.lock"
          cp "$release_dir/image-set.json" "$work_dir/image-set.json"
          cp "$release_dir/image-set.json.bundle" "$work_dir/image-set.json.bundle"
          for name in default-microvm-vmlinux-x86_64 \
            default-microvm-rootfs-x86_64.ext4 \
            default-microvm-rootfs-x86_64.verity \
            default-microvm-rootfs-x86_64.roothash; do
            cp "$release_dir/$name" "$work_dir/base/$name"
          done
          MVM_HOME="$RUNNER_TEMP/mvm-home" "$binary" \
            --builder firecracker __builder-shell-job \
            --script "$GITHUB_WORKSPACE/scripts/run-python-image-builder.sh" \
            --work-dir "$work_dir" --artifact-out "$output"
          test -s "$output/python-image/candidate.json"
          test -s "$output/python-image/composition/rootfs.ext4"
          test -s "$output/python-image/composition/composition.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-python-image-${{ github.run_id }}
          path: ${{ runner.temp }}/python-image-output/python-image/
          if-no-files-found: error
          retention-days: 7
