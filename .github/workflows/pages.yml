name: Publish registry pages

on:
  push:
    branches: [main]
    paths:
      - "index.json"
      - "revocations.toml"
      - "packs/**"
      - "docs/registry/**"
      - "docs/publishing-a-pack.md"
      - "scripts/build-pack-pages.py"
      - "astro.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "src/content.config.ts"
      - "src/styles/**"
      - "scripts/stage-starlight-pages.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: registry-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: npm ci
      - name: Build site from published manifests
        run: |
          python3 scripts/validate-packs.py
          python3 scripts/build-pack-pages.py
          node scripts/stage-starlight-pages.mjs
          npm run build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
