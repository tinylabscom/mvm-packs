name: Sign instruction files

# Keyless-signs this repository's agent instruction files (CLAUDE.md,
# AGENTS.md, SKILL.md, .claude/**/*.md, .cursor/rules/**, ...) under this
# workflow's own GitHub Actions OIDC identity. The steps live in the
# composite action tinylabscom/mvm/.github/actions/sign-instructions, which
# verifies every fresh bundle through mvmctl's in-process Sigstore verifier
# under a policy trusting exactly this workflow on this ref, then uploads the
# bundles as an artifact.
#
# It never commits. The job holds no write access to the repository. The
# intended publishing model is the reviewed two-step from the mvm
# instruction-provenance guide: merge the instruction change, let this
# read-only workflow sign it on main, then commit the artifact's bundles
# beside the files in a follow-up pull request.
#
# This file must never gain a workflow_call trigger: a called workflow signs
# under the called file's identity whoever called it, and a policy trusting
# that identity would accept signatures from every caller.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/CLAUDE.md"
      - "**/CLAUDE.local.md"
      - "**/AGENTS.md"
      - "**/AGENT.md"
      - "**/GEMINI.md"
      - "**/SKILL.md"
      - "**/.claude/**/*.md"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - ".github/workflows/sign-instructions.yml"

permissions:
  contents: read
  id-token: write

# Serialize rather than cancel: pull requests never trigger this workflow, so
# cancelling could only kill a signing run already in flight, leaving a
# cancelled run with no bundles.
concurrency:
  group: sign-instructions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign:
    name: Sign and verify instruction files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pin a full commit SHA to fix the signing code this repository runs.
      - uses: tinylabscom/mvm/.github/actions/sign-instructions@11a74da10316c6a4bcbb4416996280b0f9188f51
        with:
          cache-key: instruction-signing
