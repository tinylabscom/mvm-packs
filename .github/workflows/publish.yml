name: Publish signed packs

# The pack registry is this repository: pack sources under pack-sources/ are
# built into signed, content-addressed packs under packs/, exactly the layout
# `mvmctl search` and `mvmctl pull` read. Every manifest is signed keyless by
# this workflow; the mvm client verifies the bundle on pull and on every
# policy load against the publisher trust policy, whose built-in default
# accepts this workflow's identity:
#
#   https://github.com/tinylabscom/mvm-packs/.github/workflows/publish.yml@refs/heads/main
#
# Signing happens while the run's OIDC identity is refs/heads/main (a push
# trigger), before the artifacts commit, so the identity is stable across
# runs.

on:
  push:
    branches: [main]
    paths:
      - "pack-sources/**"
      - "scripts/build-packs.py"
      - "scripts/validate-packs.py"
      - "scripts/publisher_identity.py"
      - "scripts/build-revocations.py"
      - "revocations.toml"
      - ".github/workflows/publish.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      mvmctl_tag:
        description: Signed compatible mvmctl release tag; empty publishes the catalogue only
        required: false
        type: string
      mvmctl_archive_sha256:
        description: SHA-256 of the signed Linux x86_64 release archive
        required: false
        type: string

permissions: {}
concurrency:
  group: signed-pack-publisher
  cancel-in-progress: false

jobs:
  validate_dispatch:
    runs-on: ubuntu-latest
    env:
      MVMCTL_TAG: ${{ inputs.mvmctl_tag }}
      MVMCTL_ARCHIVE_SHA256: ${{ inputs.mvmctl_archive_sha256 }}
    steps:
      - name: Require a complete image signing request
        run: |
          set -euo pipefail
          if [[ -z "$MVMCTL_TAG" && -z "$MVMCTL_ARCHIVE_SHA256" ]]; then
            exit 0
          fi
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$MVMCTL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$MVMCTL_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]

  sign:
    needs: validate_dispatch
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.mvmctl_tag == '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # cosign v3 writes the standard sigstore bundle (verificationMaterial)
      # the mvm client's sigstore-verify stack parses; v2 writes a legacy
      # blob bundle that verification rejects. cosign-installer cannot
      # install v3 (v3 releases ship only a sigstore bundle, no .sig), so the
      # action installs the default v2 as a bootstrap verifier and this step
      # verifies and installs v3 pinned to its release tag.
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Install cosign v3
        env:
          COSIGN_V3_VERSION: "v3.1.1"
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64.sigstore.json"
          # Sigstore signs its cosign releases keyless from its release
          # service account, not a GitHub workflow identity.
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          # The installer put v2 on PATH at $HOME/.cosign; overwrite it so the
          # build step's `cosign` is v3.
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
          cosign version

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build, sign and verify packs
        env:
          COSIGN_YES: "true"
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/build-packs.py
          python3 scripts/build-revocations.py

      - name: Verify the registry
        run: python3 scripts/validate-packs.py --verify-signatures --require-revocations

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-packs
          path: packs/
          if-no-files-found: error

  publish:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Preserve previous signed revocations
        run: |
          if test -f packs/revocations.json; then
            cp packs/revocations.json "$RUNNER_TEMP/previous-revocations.json"
            cp packs/revocations.sigstore.json "$RUNNER_TEMP/previous-revocations.sigstore.json"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-packs
          path: packs/
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install cosign v3
        env:
          COSIGN_V3_VERSION: "v3.1.1"
        run: |
          set -euo pipefail
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfLO "${base}/cosign-linux-amd64.sigstore.json"
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify downloaded packs
        run: |
          set -euo pipefail
          python3 scripts/validate-packs.py --verify-signatures --require-revocations
          if test -f "$RUNNER_TEMP/previous-revocations.json"; then
            python3 scripts/build-revocations.py \
              --check-advance-from "$RUNNER_TEMP/previous-revocations.json" \
              --check-advance-bundle "$RUNNER_TEMP/previous-revocations.sigstore.json"
          else
            python3 -c 'import json; from pathlib import Path; assert json.loads(Path("packs/revocations.json").read_text())["sequence"] == 1'
          fi
      - name: Commit published packs
        run: |
          set -euo pipefail
          git add packs/
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='MVM Pack Publisher' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(packs): publish signed pack registry [skip ci]'
          git push origin HEAD:main

  sign_python_image:
    needs: validate_dispatch
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mvmctl_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    env:
      MVMCTL_TAG: ${{ inputs.mvmctl_tag }}
      MVMCTL_ARCHIVE_SHA256: ${{ inputs.mvmctl_archive_sha256 }}
      GH_TOKEN: ${{ github.token }}
      COSIGN_YES: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require KVM for the project builder VM
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo -n setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3
      - name: Install verified cosign v3
        env:
          COSIGN_V3_VERSION: v3.1.1
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/sigstore/cosign/releases/download/${COSIGN_V3_VERSION}"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64 "${base}/cosign-linux-amd64"
          curl --proto '=https' --tlsv1.2 -sSfL -o cosign-linux-amd64.sigstore.json "${base}/cosign-linux-amd64.sigstore.json"
          cosign verify-blob cosign-linux-amd64 \
            --bundle cosign-linux-amd64.sigstore.json \
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com
          install -m 0755 cosign-linux-amd64 "$HOME/.cosign/cosign"
          hash -r
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Reproduce and sign Python image evidence
        run: bash scripts/run-python-image-publisher.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-python-image-${{ github.run_id }}
          path: ${{ runner.temp }}/signed-python-image/
          if-no-files-found: error
          retention-days: 7
