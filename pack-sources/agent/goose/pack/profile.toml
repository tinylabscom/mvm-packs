description = "What a goose agent workload may reach and which stored secrets it may use; goose drives both major providers, so both LLM secret bindings compose."

[groups]
include = ["llm-apis", "github"]

[[overrides.secrets.bind]]
name = "anthropic"
hosts = ["api.anthropic.com"]

[[overrides.secrets.bind]]
name = "openai"
hosts = ["api.openai.com"]
