version = "2.0.1"
description = "Runnable Claude Code application: signed native binary, baked entrypoint, and Anthropic-only policy."

[application]
schema_version = 1
guest_arch = "aarch64"

[application.bundle]
source = "https://github.com/tinylabscom/mvm-packs/releases/download/pack-agent-claude-v2.0.1/claude.mvmpkg"
archive_sha256 = "c23235a61debb050a80cfa3e2a93f58de812c409c9ad58c1638fd4d609b377d6"
archive_size = 333637632
key_id = "b29ae91c7cbf09b08c3e9291d0a6655b"

# Unsigned build input checked before the descriptor is signed (ADR 003). It pins the
# musl Claude Code 2.1.273 binary exactly as embedded in the archive (loader path patched;
# see docs/adr/003-embedded-requirements.md, Evidence).
[requirements]
packages = ["claude-code-native", "mvm-agent", "bash", "coreutils", "musl"]
commands = ["bash", "sh"]

[[requirements.binaries]]
package = "claude-code-native"
path = "bin/claude"
sha256 = "7544d5d74f38f78b7d5457728dea4bf3f467befda7c1a892021dcfbfda1ab4e1"
size = 221263520

# The signed environment must carry exactly the consented policy (mvm#3716 consent record;
# mvm scripts/claude-demo-consumer.md): one request, under $0.50, the pinned model, one host.
[requirements.environment_policy]
allow_hosts = ["api.anthropic.com:443"]

[requirements.environment_policy.request_budget]
max_requests = 1
max_spend_microusd = 500000
model = "claude-haiku-4-5-20251001"
